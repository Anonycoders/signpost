name: CI

# Runs on every pull request. A content change that breaks a rule fails here,
# with a message naming the file and field, so contributors can fix it
# themselves before anyone reviews.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs first: a content mistake should be reported as a content mistake,
      # before a type error or a build failure buries it.
      - name: Validate content
        run: npm run validate

      # The schemas in schemas/ are generated from site.config.ts and committed,
      # because an editor reads them from the working tree with no build step in
      # between. A fork that renames a stage and forgets to regenerate would go
      # on offering the old name to everyone writing content, and nothing else
      # here would notice.
      - name: Check the editor schemas are current
        run: npm run schema -- --check

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build site
        run: npm run build
