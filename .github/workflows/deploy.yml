name: Deploy

# Publishes the site to GitHub Pages on every merge to the default branch.
# Works the same on github.com and on GitHub Enterprise with Pages + Actions
# enabled. If your GHE instance has Pages disabled, see docs/adopting.md for
# the artifact-based alternative.
on:
  push:
    branches: [main]
  # "Today" is baked in at build time: relative dates ("in 3 weeks"), the today
  # marker on the roadmap, and the split between upcoming and recent changes.
  # Without a nightly rebuild, a repository nobody merges to for a fortnight
  # serves a fortnight-old idea of now.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so main never lands
# on a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Supplied by configure-pages so the same build works at a domain
          # root or under a project subpath such as /signpost/.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # No chat notification belongs here. A ping on every publish announces
      # that a build happened, which is not what anyone needs to know;
      # announce.yml works out what actually changed and says that instead.
